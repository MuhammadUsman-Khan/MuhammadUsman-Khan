
name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

     # 2. Generate GitHub Contribution SVG
      - name: Generate Contribution Graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MuhammadUsman-Khan
          template: classic
          base: header, activity, community, repositories
          config_display: large
          config_timezone: Asia/Karachi
          config_output: svg
          filename: github-metrics.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          repositories: 100
          repositories_forks: yes



      # 3. Debug: List files to verify SVG exists
      - name: List repository files
        run: ls -R

      # 4. Commit and push only if file exists
      - name: Commit contribution graph if exists
        run: |
          if [ -f github-metrics.svg ]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add github-metrics.svg
            if ! git diff --cached --quiet; then
              git commit -m "Update contribution graph"
              git push origin HEAD
            else
              echo "No changes to commit"
            fi
          else
            echo "SVG file not found, skipping commit"
          fi
